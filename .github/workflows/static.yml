
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | System</title>

    <style>
        :root {
            --bg: #080a08;
            --green: #7cff9b;
            --muted: #718576;
            --border: #25372a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: #e0e9e1;
            font-family: "Courier New", monospace;
        }

        .terminal {
            width: 100%;
            max-width: 650px;
            border: 1px solid var(--border);
            background: #0b0f0c;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        .lights {
            display: flex;
            gap: 6px;
        }

        .lights span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #314737;
        }

        .content {
            padding: 55px 35px;
        }

        .label {
            color: var(--green);
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(30px, 7vw, 54px);
            letter-spacing: -2px;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        h1 span {
            color: var(--green);
        }

        .description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.9;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 35px 0 22px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 11px;
            color: var(--muted);
        }

        .online {
            color: var(--green);
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 1em;
            background: var(--green);
            vertical-align: -2px;
        }

        .footer {
            padding: 13px 18px;
            border-top: 1px solid var(--border);
            color: #506455;
            font-size: 10px;
        }

        @media (max-width: 480px) {
            .content {
                padding: 40px 22px;
            }

            .topbar {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <main class="terminal">
        <header class="topbar">
            <div class="lights">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div>root@unknown:~</div>
            <div>v1.0</div>
        </header>

        <section class="content">
            <div class="label">[ SYSTEM MESSAGE ]</div>

            <h1>COMING<br>SOON<span>.</span><span class="cursor"></span></h1>

            <p class="description">
                &gt; Something is being built.<br>
                &gt; New project. New possibilities.<br>
                &gt; Access will be available soon.
            </p>

            <div class="divider"></div>

            <div class="status">
                <span>STATUS: <span class="online">IN DEVELOPMENT</span></span>
                <span>ACCESS: RESTRICTED</span>
            </div>
        </section>

        <footer class="footer">
            CONNECTION ESTABLISHED // PLEASE STAND BY
        </footer>
    </main>
</body>
</html>
