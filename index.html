
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Scan // Coming Soon</title>

<style>
    :root {
        --green: #53ff8b;
        --dim: #43885a;
        --bg: #050806;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--green);
        font-family: "Courier New", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            #00000035 4px
        );
        z-index: 5;
    }

    .terminal {
        width: 100%;
        max-width: 760px;
        border: 1px solid #235d35;
        background: #070c08;
        box-shadow: 0 0 35px #00ff4110;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid #235d35;
        color: var(--dim);
        font-size: 12px;
    }

    .lights {
        display: flex;
        gap: 6px;
    }

    .lights i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        opacity: .6;
    }

    .screen {
        padding: 24px;
    }

    .banner {
        font-size: clamp(9px, 2vw, 13px);
        line-height: 1.3;
        white-space: pre;
        overflow: hidden;
        color: var(--green);
        margin-bottom: 25px;
    }

    .log {
        height: 245px;
        overflow: hidden;
        font-size: 12px;
        line-height: 1.9;
        color: #7fb98b;
    }

    .log-line {
        overflow-wrap: anywhere;
    }

    .ok {
        color: var(--green);
    }

    .warning {
        color: #c7d96b;
    }

    .progress-info {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
        font-size: 11px;
        color: var(--dim);
    }

    .progress-track {
        width: 100%;
        height: 4px;
        background: #183020;
        margin-top: 10px;
    }

    .progress {
        width: 0%;
        height: 100%;
        background: var(--green);
        box-shadow: 0 0 10px var(--green);
        transition: width .3s linear;
    }

    .result {
        display: none;
        text-align: center;
        padding: 30px 0 10px;
    }

    .result h1 {
        font-size: clamp(27px, 6vw, 48px);
        letter-spacing: 2px;
        color: #e0ffe7;
        text-shadow: 0 0 18px #53ff8b55;
    }

    .result h1 span {
        color: var(--green);
    }

    .result p {
        color: var(--dim);
        font-size: 12px;
        margin-top: 15px;
        line-height: 1.8;
    }

    .cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        background: var(--green);
        animation: blink 1s steps(2) infinite;
        vertical-align: middle;
    }

    .footer {
        border-top: 1px solid #235d35;
        padding: 12px 18px;
        font-size: 10px;
        color: var(--dim);
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    @keyframes blink {
        to { visibility: hidden; }
    }

    @media (max-width: 480px) {
        .screen { padding: 16px; }
        .log { font-size: 10px; height: 225px; }
        .topbar { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; }
        .progress { transition: none; }
    }
</style>
</head>

<body>
<main class="terminal">
    <header class="topbar">
        <div class="lights"><i></i><i></i><i></i></div>
        <div>SYS://INITIALIZATION</div>
        <div>v0.1.0</div>
    </header>

    <section class="screen">
        <pre class="banner">
   _____ __  __
  / ___// / / /
  \__ \/ /_/ /
 ___/ / __  /
/____/_/ /_/
        </pre>

        <div class="log" id="log" aria-live="polite"></div>

        <div class="progress-info">
            <span id="status">INITIALIZING SCAN</span>
            <span id="percent">0%</span>
        </div>

        <div class="progress-track">
            <div class="progress" id="progress"></div>
        </div>

        <div class="result" id="result">
            <h1>COMING SOON<span>_</span></h1>
            <p>
                SCAN COMPLETE<br>
                NEW PROJECT DETECTED<br>
                ACCESS WILL BE GRANTED SOON.
            </p>
        </div>
    </section>

    <footer class="footer">
        <span>CONNECTION: SECURE</span>
        <span id="clock">SYSTEM READY</span>
    </footer>
</main>

<script>
    const log = document.getElementById("log");
    const progress = document.getElementById("progress");
    const percent = document.getElementById("percent");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const clock = document.getElementById("clock");

    const lines = [
        ["Establishing secure connection...", "ok"],
        ["Loading system modules", "normal"],
        ["Checking local environment...", "normal"],
        ["Scanning available resources...", "normal"],
        ["Analyzing system architecture...", "normal"],
        ["Verifying encrypted channels...", "ok"],
        ["Searching for project files...", "normal"],
        ["Analyzing data structures...", "normal"],
        ["Checking access permissions...", "ok"],
        ["Compiling project components...", "normal"],
        ["Finalizing initialization sequence...", "normal"],
        ["System scan completed.", "ok"]
    ];

    let index = 0;
    let value = 0;

    function timeStamp() {
        return new Date().toLocaleTimeString("en-GB", {
            hour12: false
        });
    }

    function addLine(message, type) {
        const line = document.createElement("div");
        line.className = "log-line";

        const time = document.createElement("span");
        time.style.color = "#42694c";
        time.textContent = "[" + timeStamp() + "] ";

        const text = document.createElement("span");
        text.textContent = message;

        if (type === "ok") {
            text.className = "ok";
            text.textContent = "[ OK ] " + message;
        } else {
            text.textContent = "> " + message;
        }

        line.append(time, text);
        log.appendChild(line);

        while (log.children.length > 8) {
            log.removeChild(log.firstChild);
        }
    }

    function scan() {
        if (index < lines.length) {
            addLine(lines[index][0], lines[index][1]);
            index++;

            value = Math.min(
                100,
                Math.round(index / lines.length * 100)
            );

            progress.style.width = value + "%";
            percent.textContent = value + "%";

            if (value >= 100) {
                status.textContent = "SCAN COMPLETE";
                clock.textContent = "SYSTEM ONLINE";

                setTimeout(() => {
                    result.style.display = "block";
                    result.scrollIntoView({
                        behavior: "smooth",
                        block: "nearest"
                    });
                }, 500);
                return;
            }

            status.textContent = "SCANNING SYSTEM";
            setTimeout(scan, 650 + Math.random() * 650);
        }
    }

    addLine("Boot sequence initiated.", "ok");
    setTimeout(scan, 800);
</script>
</body>
</html>
